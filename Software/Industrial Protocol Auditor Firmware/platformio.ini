[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidades
monitor_speed = 115200
upload_speed = 921600

; Librerías
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11

; Banderas de Construcción
build_flags =
    ; >> LVGL <<
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    -D LV_TICK_CUSTOM=1
    
    ; >> PANTALLA (Driver ST7735) <<
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_REDTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON 
    
    ; >> PINES VSPI (SEGUROS) <<
    -D TFT_MISO=-1   ; No conectado
    -D TFT_MOSI=23   ; D23
    -D TFT_SCLK=18   ; D18
    -D TFT_CS=5      ; D5
    -D TFT_DC=2      ; D2
    -D TFT_RST=4     ; D4
    -D TFT_BL=15     ; D15
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=27000000